<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>A test table merged with cells</h1>
    <table border="1">
        <!-- 1st -->
       <tr>
           <th rowspan="2">            </th>
           <th colspan="2">Average</th>
           <th rowspan="2">Red eyes</th>
       </tr>
       <!-- 2nd -->
       <tr>
           <th>Height</th>
           <th>Weight</th>
           
       </tr>
       <!-- 3rd -->
       <tr>
        <th>Male</th>
           <th>1.9</th>
           <th>0.003</th>
           <th>40%</th>
       </tr>
       <!-- 4th -->
       <tr>
        <th>Female</th>
           <th>1.7</th>
           <th>0.002</th>
           <th>43%</th>
       </tr>
    </table>
</body>
</html>
