<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interndot_Form.com</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images.jpg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="parent">
            <form action="submit.html">
                <div class="child1">
                    <label for=""> Full Name</label>
                    <input type="text" placeholder="Lorex" required>
                </div>
                <div class="child2">
                    <label for="">E Mail</label>
                    <input type="password" required placeholder="abc@gmail.com">
                </div>
                <div class="child3">
                    <label for="">Phone No</label>
                    <input type="text"required placeholder="92xxxxxxxx">
                </div>
                <div class="child4">
                    <label for="">Gender</label>
                    <input type="radio" name="Gender">Male
                    <input type="radio" name="Gender">Female
                </div>
                <div class="child5">
                    <input type="submit" placeholder="Submit">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
